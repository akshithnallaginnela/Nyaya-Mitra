[pytest]
# Pytest configuration for Nyaya Mitra backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    slow: Tests that take longer to run
    database: Tests that require database connection
    websocket: Tests for WebSocket functionality
    auth: Tests for authentication
    chat: Tests for chat functionality
    case: Tests for case analysis
    document: Tests for document generation
    legal_aid: Tests for legal aid search
    translation: Tests for multilingual support

# Coverage options
[coverage:run]
source = .
omit = 
    tests/*
    */__pycache__/*
    */migrations/*
    .venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
