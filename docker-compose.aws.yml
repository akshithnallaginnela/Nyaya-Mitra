# ==============================================
# Nyaya Mitra - Full Stack Docker Compose
# Simulates AWS architecture locally for testing
# ==============================================
version: '3.8'

services:
  # ─────────────────────────────
  # PostgreSQL (simulates RDS)
  # ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nyaya_mitra_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-nyaya_mitra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nyaya-network

  # ─────────────────────────────
  # Ollama AI Server (simulates EC2 AI Layer)
  # ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: nyaya_mitra_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nyaya-network

  # ─────────────────────────────
  # FastAPI Backend (simulates ECS)
  # ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nyaya_mitra_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-nyaya_mitra}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-nyaya-mitra-uploads}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - documents_data:/app/generated_documents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - nyaya-network

  # ─────────────────────────────
  # Nginx Reverse Proxy (simulates ALB)
  # ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nyaya_mitra_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nyaya-network

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
  chroma_data:
  documents_data:

networks:
  nyaya-network:
    driver: bridge
